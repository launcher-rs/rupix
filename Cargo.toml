[package]
name = "rupix"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# rgpui 暂用并列目录里的源码（rgpui_workspace/rgpui）：Linux 浮层 visual 选择、
# show=false 隐藏启动、帧同步握手三处修复目前只在源码中，crates.io 上的 1.4.1 还没有。
# rgpui 发新版后把下面两行的 path 换回 version = "x.y.z" 即可，特性保持不变。
rgpui = { version = "1.6", features = ["screen-capture"] }
# Linux 图形后端二选一（wayland / x11），缺省两个都不开时运行时直接 unreachable 崩溃；
# 注意 rgpui 自身的同名特性是空壳，真正的后端开关在 rgpui-linux，经 rgpui-platform 透传才生效。
rgpui-platform = { version = "1.6", features = [
  "screen-capture",
  "wayland",
  "x11",
] }
# 图片编解码与像素操作：首帧保存、选区裁剪、马赛克、导出 PNG。
# 只开常用格式：全默认会经特性统一把 avif（rav1e 整套编码器）/ tiff / exr 等
# 重新引入，抵消 rgpui 的体积裁剪；冷门格式在“打开图片编辑”时报不支持。
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "bmp",
  "ico",
  "webp",
  "pnm",
] }
# 字形光栅化：把文字标注烧录进导出图片（系统字体文件加载）。
ab_glyph = "0.2"
# 通用错误类型（库逻辑与 example 共用）。
anyhow = "1"
# OCR spike：PaddleOCR 系 Rust 实现（MNN 推理），中英文识别。
# 模型（三件套约 21MB）放 git 忽略的 temp/ocr-models，见 examples/ocr_spike.rs。
ocr-rs = "2.4"

[features]
# 调试面板透传：debug 构建默认启用检查器（F12）；
# release 下默认剥离，如需保留用 `--features inspector` 显式开启。
inspector = ["rgpui/inspector"]
# OCR 模型内嵌：把 PP-OCRv5 mobile 三件套（约 21MB）用 include_bytes! 打进二进制，
# 运行时零外部文件，开箱即用，适合发版安装包；
# 默认关闭（外置加载，开发期迭代快、二进制小）。
# 模型已进仓库（`assets/ocr-models/`），更新版本才需跑 `scripts/download-ocr-models.ps1`。
# 用法：`cargo run --features bundled-ocr-models`。
bundled-ocr-models = []

# release 优化：截图工具常驻后台，启动速度与包体积优先。
# 日常发版用 thin LTO（构建快）；打安装包用下面的 size 档（体积最小）。
[profile.release]
# 最高优化等级，图片编解码与标注烧录受益明显。
opt-level = 3
# 跨 crate 内联 + 死代码消除，增量代价可接受（rgpui 体积指南 §2.1）。
lto = "thin"
# 单代码生成单元，配合 lto 进一步内联，牺牲并行编译速度换运行速度。
codegen-units = 1
# 剥离符号表，减小发布包体积。
strip = true

# size 档：只用于打安装包（构建慢，体积最小），日常开发继续用 release。
[profile.size]
inherits = "release"
# 体积优先。
opt-level = "z"
# fat LTO：比 thin 更彻底的跨 crate 内联与死代码消除。
lto = true
codegen-units = 1
strip = true

# Windows 双格式剪贴板（图片 + 文件）需要直接调用系统剪贴板 API，
# rgpui 内建写剪贴板在 Windows 后端会忽略文件条目，故直接依赖 windows。
# 另需 GDI（CLI 全屏截图 BitBlt）、Console（release 无控制台时挂接父控制台输出）
# 与 Registry（设置页开机启动项读写 HKCU\...\Run）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
# 取原生窗口句柄（HWND）：rgpui 的 `Window` 只通过 raw-window-handle 标准 trait
# 暴露原生句柄，保存提示胶囊要用它把自己排除出抓屏（SetWindowDisplayAffinity）。
# rgpui 本身已经依赖同一版本（0.6.x），不新增任何下载体积。
raw-window-handle = "0.6"



[build-dependencies]
# Windows exe 图标嵌入（任务栏 / 资源管理器显示应用 logo），仅 build.rs 使用。
embed-resource = "3"

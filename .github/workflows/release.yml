# 手动发布滚动 Release（固定 tag `latest`；全平台触发删旧建新，单平台触发只替换该平台附件）。
# 仅 workflow_dispatch，不自动触发。各平台编完即传附件，互不等待；Windows 必过，Linux/macOS 尽力而为。
# 每平台两个包：常规版（exe + 外置 models/）与内嵌版（--features bundled-ocr-models，开箱即用）。
name: release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '编译档'
        required: false
        default: 'size'
        type: choice
        options: [size, release]
      platform:
        description: '编译平台（单选某平台可单独重编，不碰其他平台附件）'
        required: false
        default: 'all'
        type: choice
        options: [all, windows, linux, macos]

permissions:
  contents: write

jobs:
  # 先建好空 Release，各平台 job 只管往里传附件：早编完早发布，不用等最慢的。
  # 顺带按 platform 输入算出本次要跑的矩阵（job 级 if 不支持 matrix，只能走 outputs 动态矩阵）。
  prepare:
    name: 准备 rolling Release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # gh release 系列命令要靠 git 确定仓库，prepare 也必须先检出。
      - uses: actions/checkout@v4

      - name: 算本次矩阵
        id: set-matrix
        shell: bash
        run: |
          win='{"id":"windows","os":"windows-latest","name":"windows-x86_64","best-effort":false}'
          lin='{"id":"linux","os":"ubuntu-22.04","name":"linux-x86_64","best-effort":true}'
          mac='{"id":"macos","os":"macos-latest","name":"macos-aarch64","best-effort":true}'
          case "${{ inputs.platform }}" in
            windows) m="[$win]" ;;
            linux) m="[$lin]" ;;
            macos) m="[$mac]" ;;
            *) m="[$win,$lin,$mac]" ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
      - name: 建空 latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.platform }}" = "all" ]; then
            # 同名附件直接上传会冲突，全平台触发时删旧建新；单平台触发跳过，保留其他平台附件。
            gh release delete latest --cleanup-tag -y || true
          fi
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "最新构建（手动触发，滚动更新）" --notes ""
          fi
          gh release edit latest --title "最新构建（手动触发，滚动更新）" --notes "编译档：${{ inputs.profile }}（size 体积最小，release 速度优先）；Windows 静态 CRT，免装运行库。

          滚动更新：全平台触发删旧建新；单平台触发只替换该平台附件，不碰其他的。
          每个平台两个包：常规版 rupix-<平台>.zip（exe + 外置 models/，解压即用）；内嵌版 *-bundled.zip（模型打进二进制，单文件开箱即用，体积 +21MB）。
          说明：Windows 为主力验证平台；Linux/macOS 为交叉尝试编译，未在真机完整验证，遇到问题欢迎提 Issue。
          Linux 基线：Ubuntu 22.04+ / Debian 12+ / Fedora 35+（glibc ≥ 2.35），更老系统请用源码编译。"

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    # Linux/macOS 只是尝试编译：本机无对应设备验证，挂了也不阻塞其他平台发版。
    continue-on-error: ${{ matrix.best-effort }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ocr-rs 经 bindgen 要用 libclang，Windows runner 默认没有，装一份 LLVM。
      - name: 安装 LLVM（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files\LLVM\bin\libclang.dll')) {
            winget install -e --id LLVM.LLVM --silent --accept-source-agreements --accept-package-agreements
          }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # rgpui Linux 后端要 Wayland/X11 开发库，bindgen 要 libclang。
      # 注意：libclang 解压约 300MB，这步要几分钟，不是卡死；--no-install-recommends 已砍掉附带推荐包。
      # build-essential / pkg-config / gcc 是 runner 自带，不重复装；clang 编译器本体不需要（bindgen 只用 libclang.so）。
      # Linux 故意钉在 22.04 runner：glibc 只能向前兼容，在越老的系统上编译，产物的基线越低（22.04 → glibc 2.35）。
      # musl 全静态走不通（ocr-rs 预编译 MNN 库 + Wayland/X11 图形栈都是 glibc 生态），这是 GUI 应用的通用做法。
      - name: 安装系统依赖（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libasound2-dev libudev-dev
      # 注：-lX11-xcb 由 libx11-xcb-dev 提供（CI 曾在此 link 失败）；libxkbcommon-x11-dev 同属 X11 链接组，提前备好免得再跑一轮。

      # macOS 用 brew 的 llvm 提供 libclang（Xcode 自带的不一定被 bindgen 找到）。
      - name: 安装 LLVM（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm || true
          if [ -d /opt/homebrew/opt/llvm ]; then echo "LIBCLANG_PATH=/opt/homebrew/opt/llvm/lib" >> "$GITHUB_ENV"; fi
          if [ -d /usr/local/opt/llvm ]; then echo "LIBCLANG_PATH=/usr/local/opt/llvm/lib" >> "$GITHUB_ENV"; fi

      # 两次构建产物同名（target/<profile>/rupix），中途改名存下，避免后一次覆盖前一次。
      # 静态 CRT 与 git 拉取配置由仓库 .cargo/config.toml 自带，CI 无需另配。
      - name: 编译（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prof = '${{ inputs.profile }}'
          New-Item -ItemType Directory -Force -Path 'pkg' | Out-Null
          cargo build --profile $prof
          Copy-Item -Path "target/$prof/rupix.exe" -Destination 'pkg/rupix-regular.exe'
          cargo build --profile $prof --features bundled-ocr-models
          Copy-Item -Path "target/$prof/rupix.exe" -Destination 'pkg/rupix-bundled.exe'

      - name: 编译（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prof='${{ inputs.profile }}'
          mkdir -p pkg
          cargo build --profile "$prof"
          cp "target/$prof/rupix" pkg/rupix-regular
          cargo build --profile "$prof" --features bundled-ocr-models
          cp "target/$prof/rupix" pkg/rupix-bundled

      # 常规包：exe + build.rs 已分发到输出目录旁的 models/；内嵌包：单文件即可。
      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prof = '${{ inputs.profile }}'
          New-Item -ItemType Directory -Force -Path 'dist', 'stage-regular', 'stage-bundled' | Out-Null
          Copy-Item -Path 'pkg/rupix-regular.exe', 'README.md', 'LICENSE-APACHE' -Destination 'stage-regular/'
          Rename-Item -Path 'stage-regular/rupix-regular.exe' -NewName 'rupix.exe'
          Copy-Item -Path 'pkg/rupix-bundled.exe', 'README.md', 'LICENSE-APACHE' -Destination 'stage-bundled/'
          Rename-Item -Path 'stage-bundled/rupix-bundled.exe' -NewName 'rupix.exe'
          if (Test-Path "target/$prof/models") {
            Copy-Item -Path "target/$prof/models" -Destination 'stage-regular/models' -Recurse
          } else {
            Write-Output '::warning::输出目录旁没有 models（构建脚本未分发），常规包缺 OCR 模型'
          }
          Compress-Archive -Path 'stage-regular/*' -DestinationPath 'dist/rupix-${{ matrix.name }}.zip'
          Compress-Archive -Path 'stage-bundled/*' -DestinationPath 'dist/rupix-${{ matrix.name }}-bundled.zip'

      - name: 打包（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prof='${{ inputs.profile }}'
          mkdir -p dist stage-regular stage-bundled
          cp pkg/rupix-regular stage-regular/rupix
          cp README.md LICENSE-APACHE stage-regular/
          cp pkg/rupix-bundled stage-bundled/rupix
          cp README.md LICENSE-APACHE stage-bundled/
          if [ -d "target/$prof/models" ]; then
            cp -r "target/$prof/models" stage-regular/models
          else
            echo "::warning::输出目录旁没有 models（构建脚本未分发），常规包缺 OCR 模型"
          fi
          tar -czf "dist/rupix-${{ matrix.name }}.tar.gz" -C stage-regular .
          tar -czf "dist/rupix-${{ matrix.name }}-bundled.tar.gz" -C stage-bundled .

      # 冒烟：二进制能启动（--version/--help 立刻退出，不碰 GUI），单测复用本 profile 已编好的依赖。
      # 必须用 Start-Process -Wait -PassThru：发布档是 windows_subsystem="windows" 的 GUI 子系统程序，
      # pwsh 的 `&` 对这类程序不等待退出、也不给 $LASTEXITCODE 赋值（保持 null），
      # 于是 `if ($LASTEXITCODE -ne 0)` 恒为真 —— 直接调用哪怕成功退出也会误报冒烟失败。
      # cargo 是控制台程序，不受此影响，仍按 $LASTEXITCODE 判断。
      - name: 冒烟（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 转绝对路径：Start-Process 按进程工作目录解析相对路径，与 PowerShell 当前位置未必一致。
          $exe = (Resolve-Path -LiteralPath '.\pkg\rupix-regular.exe').Path
          foreach ($flag in '--version', '--help') {
            $proc = Start-Process -FilePath $exe -ArgumentList $flag -NoNewWindow -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "冒烟失败：$flag（退出码 $($proc.ExitCode)）" }
          }
          cargo test --profile '${{ inputs.profile }}'
          if ($LASTEXITCODE -ne 0) { throw '冒烟失败：cargo test' }

      - name: 冒烟（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prof='${{ inputs.profile }}'
          ./pkg/rupix-regular --version
          ./pkg/rupix-regular --help >/dev/null
          cargo test --profile "$prof"
          if [ "$(uname)" = "Darwin" ]; then
            otool -L pkg/rupix-regular
          else
            echo 'glibc 基线需求（最高三行）：'
            objdump -T pkg/rupix-regular | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3
          fi

      # 本平台编完立刻上传（--clobber 覆盖同名旧附件，支持单独重跑本 job）。
      - name: 发布附件（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest dist/*.zip --clobber

      - name: 发布附件（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest dist/*.tar.gz --clobber
